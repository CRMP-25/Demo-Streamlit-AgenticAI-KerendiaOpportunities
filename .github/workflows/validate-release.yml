name: Healthcare Intelligence - Validate Release
on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py src tests scripts
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -q
      - name: KG checksum, version, and offline report snapshots
        run: python -m scripts.release_check release_artifacts
      - name: Preserve reproducible offline reports
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.sha }}
          path: release_artifacts/
          retention-days: 90
